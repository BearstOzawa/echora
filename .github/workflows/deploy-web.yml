name: Deploy Web

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: echora-web-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_ECHORA_CLOUD_URL: https://echora-cloud.lili.uno
      ECHORA_CLOUD_URL: https://echora-cloud.lili.uno
      ECHORA_CLOUD_INGESTION_SECRET: ${{ secrets.ECHORA_CLOUD_INGESTION_SECRET }}
      ECHORA_PRODUCT: echora-web
      ECHORA_ENVIRONMENT: production
      ECHORA_DEPLOYMENT_URL: https://echora-web.lili.uno
    steps:
      - name: Check deployment configuration
        id: configuration
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" && -n "$ECHORA_CLOUD_INGESTION_SECRET" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Web deployment is disabled until the production environment secrets are configured."
          fi
      - uses: actions/checkout@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        if: steps.configuration.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.configuration.outputs.ready == 'true'
      - run: npm run build:web
        if: steps.configuration.outputs.ready == 'true'
      - run: npx wrangler deploy
        if: steps.configuration.outputs.ready == 'true'
      - name: Verify production
        if: steps.configuration.outputs.ready == 'true'
        run: curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 https://echora-web.lili.uno/ > /dev/null
      - name: Read version
        if: steps.configuration.outputs.ready == 'true'
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Register deployment
        if: steps.configuration.outputs.ready == 'true'
        env:
          ECHORA_VERSION: ${{ steps.version.outputs.value }}
          ECHORA_BUILD_ID: ${{ github.event.workflow_run.head_sha || github.sha }}
          ECHORA_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: npm run deployment:register
